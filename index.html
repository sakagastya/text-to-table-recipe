<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Kitchen — Cooking for Engineers Generator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%23059669' stroke-width='3'/%3E%3Crect x='3' y='3' width='14' height='14' fill='%23059669'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <div class="brand-mark">MK</div>
    <div>
      <h1>Matrix Kitchen</h1>
      <p data-i18n="tagline">Recipe text &rarr; editorial cooking matrix</p>
    </div>
  </div>

  <section class="panel">
    <h2 class="panel-title"><span class="num">01</span> <span data-i18n="p1">AI Auto-Extract</span></h2>
    <label class="field">
      <span data-i18n="modeLabel">Input mode</span>
      <select id="aiMode">
        <option value="source" data-i18n="modeSource">From link or text</option>
        <option value="invent" data-i18n="modeInvent">Invent with AI</option>
      </select>
    </label>
    <label class="field">
      <span data-i18n="provider">Provider</span>
      <select id="provider">
        <option value="gemini">Google Gemini</option>
        <option value="openai">OpenAI</option>
      </select>
    </label>
    <label class="field">
      <span><span data-i18n="apiKey">API key</span> <em data-i18n="apiKeyNote">(stored only in your browser)</em></span>
      <input type="password" id="apiKey" placeholder="Paste your key…" autocomplete="off" data-i18n-ph="keyPh">
    </label>
    <label class="field">
      <span data-i18n="rawText">Raw recipe / blog text</span>
      <textarea id="rawText" rows="6" placeholder="Paste a recipe link (web page or video) or the messy text here…" data-i18n-ph="rawTextPh"></textarea>
    </label>
    <button id="generateBtn" class="btn primary" data-i18n="genBtn">Create cooking table</button>
  </section>

  <section class="panel grow">
    <h2 class="panel-title"><span class="num">02</span> <span data-i18n="p2">DSL Code Studio</span></h2>
    <label class="field">
      <span data-i18n="syntax">Syntax</span>
      <div class="syntax-legend">
        <code>Title: Name</code><code>## COMPONENT: Name</code><code>[Group]</code>
        <code>- ingredient</code><code>&gt; action</code><code>&gt; (wait)</code><code>&gt; action (Group A, Group B)</code>
      </div>
    </label>
    <textarea id="dslInput" spellcheck="false" aria-label="DSL editor"></textarea>
  </section>

  <section class="panel">
    <h2 class="panel-title"><span class="num">03</span> <span data-i18n="p3">Appearance</span></h2>
    <div class="field">
      <span data-i18n="theme">Theme</span>
      <div class="swatches" id="swatches"></div>
    </div>
    <label class="field">
      <span data-i18n="accent">Custom accent</span>
      <input type="color" id="accentPicker" value="#059669">
    </label>
    <label class="field range">
      <span><span data-i18n="cellFont">Cell font</span> <output id="fontOut">14 px</output></span>
      <input type="range" id="fontRange" min="11" max="20" step="1">
    </label>
    <label class="field range">
      <span><span data-i18n="cellPad">Cell padding</span> <output id="padOut">10 px</output></span>
      <input type="range" id="padRange" min="4" max="22" step="1">
    </label>
    <div class="field">
      <span data-i18n="layout">Layout</span>
      <div class="layout-grid">
        <label class="mini full">
          <span data-i18n="flow">Table flow</span>
          <select id="orientSel">
            <option value="h" data-i18n="horizontal">Horizontal</option>
            <option value="v" data-i18n="vertical">Vertical</option>
          </select>
        </label>
        <label class="mini">
          <span data-i18n="ingText">Ingredient text</span>
          <select id="ingDir">
            <option value="h" data-i18n="horizontal">Horizontal</option>
            <option value="v" data-i18n="vertical">Vertical</option>
          </select>
        </label>
        <label class="mini">
          <span data-i18n="actText">Action text</span>
          <select id="actDir">
            <option value="auto" data-i18n="auto">Auto</option>
            <option value="h" data-i18n="horizontal">Horizontal</option>
            <option value="v" data-i18n="vertical">Vertical</option>
          </select>
        </label>
        <label class="mini">
          <span data-i18n="ingWords">Ingredient words/line</span>
          <select id="ingWrap">
            <option value="0" data-i18n="auto">Auto</option>
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
          </select>
        </label>
        <label class="mini">
          <span data-i18n="actWords">Action words/line</span>
          <select id="actWrap">
            <option value="0" data-i18n="auto">Auto</option>
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
          </select>
        </label>
      </div>
    </div>
    <button id="resetAccent" class="btn ghost subtle" data-i18n="resetAccent">Reset accent</button>
  </section>

  <footer class="sidebar-foot">
    <p data-i18n="foot">100% client-side. No backend, no build step. Ready for GitHub Pages.</p>
  </footer>
</aside>

<main id="main">
  <header id="topbar">
    <div class="tool-group">
      <label class="tool">
        <span data-i18n="langLabel">Language</span>
        <select id="outputLang">
          <option value="en">English</option>
          <option value="id">Bahasa Indonesia</option>
        </select>
      </label>
      <label class="tool">
        <span data-i18n="portions">Portions</span>
        <select id="portion">
          <option value="0.5">&frac12;&times;</option>
          <option value="1" selected>1&times;</option>
          <option value="2">2&times;</option>
          <option value="5">5&times;</option>
        </select>
      </label>
      <label class="tool switch-tool">
        <span data-i18n="cooking">Cooking mode</span>
        <span class="switch">
          <input type="checkbox" id="cookingToggle">
          <span class="knob"></span>
        </span>
      </label>
    </div>
    <div class="tool-group">
      <button id="shopBtn" class="btn" data-i18n="shopBtn">Shopping list</button>
      <button id="pngBtn" class="btn primary" data-i18n="pngBtn">Save as PNG</button>
    </div>
  </header>

  <div id="canvas" aria-live="polite"></div>
</main>

<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle" data-i18n="shopTitle">Shopping List</h3>
      <button id="modalClose" class="icon-btn" aria-label="Close">&times;</button>
    </div>
    <p class="modal-note"><span data-i18n="scaledTo">Scaled to</span> <strong id="modalPortion">1&times;</strong> <span data-i18n="shopNote">&middot; duplicates consolidated &middot; metric units enforced</span></p>
    <ul id="shopList"></ul>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="script.js?v=16"></script>
</body>
</html>
